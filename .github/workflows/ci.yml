name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so the build can validate env; no real secrets needed
      BACKEND_URL: http://localhost:3000
      NEXT_PUBLIC_DOMAIN_NAME: example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - name: Audit production dependencies
        run: yarn audit --groups dependencies --level high
