name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so the build can validate env; no real secrets needed
      BACKEND_URL: http://localhost:3000
      NEXT_PUBLIC_DOMAIN_NAME: example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - name: Audit production dependencies
        # Yarn 1's --level only filters the report: the exit code is a bitmask
        # of every severity found (1 info, 2 low, 4 moderate, 8 high,
        # 16 critical). Fail only on high or critical.
        run: |
          set +e
          yarn audit --groups dependencies --level high
          status=$?
          set -e
          if [ $((status & 24)) -ne 0 ]; then
            echo "High or critical vulnerabilities found (exit $status)"
            exit 1
          fi
